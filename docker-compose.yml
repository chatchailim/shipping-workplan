services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shipping_workplan
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping_dev_only
    ports:
      - "5433:5432"
    volumes:
      - shipping_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping_workplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://shipping:shipping_dev_only@postgres:5432/shipping_workplan?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env; use at least 32 random characters}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.invalid}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-before-running-seed}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

volumes:
  shipping_pgdata:
