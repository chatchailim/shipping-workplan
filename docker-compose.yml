services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shipping_workplan
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping_dev_only
    ports:
      - "5433:5432"
    volumes:
      - shipping_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping_workplan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shipping_pgdata:
